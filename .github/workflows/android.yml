name: Android build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm64-v8a,   target: aarch64 }
          - { name: armeabi-v7a, target: armv7 }
          - { name: x86,         target: i686 }
          - { name: x86_64,      target: x86_64 }
          # No --target: Tauri builds all four ABIs into one fat APK.
          - { name: universal,   target: "" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            tauri-plugin-scenic
          key: ${{ matrix.name }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK/NDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: npm ci

      - name: Generate Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi
          # Launcher icons come from app-icon.png (copies into gen/android)
          npx tauri icon app-icon.png

      - name: Build release APK
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri android build --apk --target ${{ matrix.target }} --ci
          else
            npx tauri android build --apk --ci
          fi

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Signing with the keystore from repository secrets."
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
          else
            echo "::warning::No signing secrets set. Using a throwaway keystore: APKs install fine, but each build has a different signature, so they cannot update one another."
            KEYSTORE_PASSWORD="android-ci"; KEY_ALIAS="scenic"; KEY_PASSWORD="android-ci"
            keytool -genkeypair -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Scenic CI" >/dev/null
          fi

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir -p dist

          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "No APK produced"; exit 1; }
          echo "Built: $APK"

          OUT="dist/Scenic-${VERSION}-${{ matrix.name }}.apk"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: scenic-${{ matrix.name }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: scenic-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
