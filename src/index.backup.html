<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scenic</title>
  <style>
    :root {
      --bg: #101114;
      --surface: #1b1d22;
      --text: #eceef2;
      --muted: #9097a3;
      --accent: #7cc4a4;
      --error: #ef8a7d;
      --on-accent: #0b1a13;
      color-scheme: dark;
    }
    /* Light palette: used when Android is in light mode (theme "auto") or
       when the user forces it. A forced "dark" keeps the defaults above. */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --text: #14161a;
        --muted: #5d6470;
        --accent: #247a58;
        --error: #c2392b;
        --on-accent: #ffffff;
        color-scheme: light;
      }
    }
    :root[data-theme="light"] {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --text: #14161a;
        --muted: #5d6470;
        --accent: #247a58;
        --error: #c2392b;
        --on-accent: #ffffff;
        color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 22px; font-weight: 600; }
    #theme { padding: 8px 14px; font-size: 14px; color: var(--muted); }
    .preview {
      flex: 1;
      min-height: 0;
      border-radius: 16px;
      background: var(--surface) center / cover no-repeat;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      font: inherit;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }
    button.primary { grid-column: 1 / -1; background: var(--accent); color: var(--on-accent); font-weight: 600; }
    button:disabled { opacity: 0.5; }
    #status { min-height: 1.45em; margin: 0; color: var(--muted); font-size: 14px; }
    #status.error { color: var(--error); }
  </style>
</head>
<body>
  <header>
    <h1>Scenic</h1>
    <button id="theme" type="button" aria-label="Theme"></button>
  </header>
  <div class="preview" id="preview"></div>

  <div class="actions">
    <button class="primary" data-action="download">Save to Photos</button>
    <button data-action="home">Set home</button>
    <button data-action="lock">Set lock</button>
    <button class="primary" data-action="both">Set both</button>
  </div>
  <p id="status"></p>

  <script>
    // ---------------------------------------------------------------
    // Scenic API. These functions are the bridge to the Rust side.
    // Keep this block and change everything else as you like.
    // ---------------------------------------------------------------
    const { invoke } = window.__TAURI__.core;

    const Scenic = {
      /**
       * Save an image to Pictures/Scenic/ on the device.
       * @param {string} dataUri  "data:image/...;base64,..." or bare base64
       * @param {string} [fileName] optional; extension is fixed up automatically
       * @returns {Promise<{uri, fileName, relativePath, mimeType, bytes}>}
       */
      downloadWallpaper(dataUri, fileName) {
        return invoke('download_wallpaper', { dataUri, fileName: fileName ?? null });
      },

      /**
       * Set the wallpaper.
       * @param {string} dataUri  "data:image/...;base64,..." or bare base64
       * @param {'home'|'lock'|'both'} [target='both']
       * @returns {Promise<{target, mimeType, bytes}>}
       */
      setWallpaper(dataUri, target = 'both') {
        return invoke('set_wallpaper', { dataUri, target });
      },

      /**
       * Match the Android status and navigation bars to the app's theme,
       * which may differ from the system theme. Rejects with kind
       * "unsupported" off Android.
       * @param {boolean} dark  true if the APP is dark (bar icons turn light)
       * @param {string} [color]  "#RRGGBB" bar background for Android 14 and
       *        older; Android 15+ ignores it and shows the page behind the bars
       * @returns {Promise<void>}
       */
      setSystemBars(dark, color) {
        return invoke('set_system_bars', { dark, color: color || null });
      },

      // ---- Image cache -------------------------------------------------
      // Lives in the app's cache folder, so Android's "Clear cache" wipes it.
      // imageType: 'thumbnail' | 'fullres' (and 'any' for erase/expire).
      // Creation time is recorded automatically.

      /**
       * Download an image and cache it, replacing any older entry for the
       * same url + type.
       * @param {'thumbnail'|'fullres'} imageType
       * @param {string} url   http(s) image URL
       * @param {number} days  how long to keep it (fractions allowed)
       * @returns {Promise<{imageType, url, createdAt, expiresAt, bytes, mimeType}>}
       *          createdAt / expiresAt are Unix milliseconds
       */
      storeImageCache(imageType, url, days) {
        return invoke('store_image_cache', { imageType, url, days });
      },

      /**
       * Delete cached images created `olderThanDays` or more days ago
       * (0 = everything of that type). Other types and newer entries stay.
       * @param {'thumbnail'|'fullres'|'any'} imageType
       * @param {number} olderThanDays
       * @returns {Promise<{removed, freedBytes}>}
       */
      eraseImageCache(imageType, olderThanDays) {
        return invoke('erase_image_cache', { imageType, olderThanDays });
      },

      /**
       * Delete cached images whose creation time + lifetime has passed.
       * @param {'thumbnail'|'fullres'|'any'} [imageType='any']
       * @returns {Promise<{removed, freedBytes}>}
       */
      clearExpiredImageCache(imageType = 'any') {
        return invoke('clear_expired_image_cache', { imageType });
      },

      /**
       * Get an image as a data URI for <img src>. Uses the cache when it has
       * a live entry; otherwise downloads, caches (for `days`) and returns it.
       * @param {'thumbnail'|'fullres'} imageType
       * @param {string} url
       * @param {number} days  lifetime for a newly written entry
       * @param {boolean} [forceRefresh=false] ignore the cache and fetch anew
       * @returns {Promise<string>} "data:image/...;base64,..."
       */
      loadImageCache(imageType, url, days, forceRefresh = false) {
        return invoke('load_image_cache', { imageType, url, days, forceRefresh });
      },

      /** Helper: turn an image URL (or Blob) into a data URI. */
      async toDataUri(source) {
        const blob = source instanceof Blob ? source : await (await fetch(source)).blob();
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(blob);
        });
      },
    };
    window.Scenic = Scenic;

    // ---------------------------------------------------------------
    // Theme. "auto" follows Android's light/dark setting; "light" and
    // "dark" override it. Whatever is in effect is pushed to the native
    // status/navigation bars, so they stay readable even when the app
    // theme differs from the system theme.
    // ---------------------------------------------------------------
    const THEME_KEY = 'scenic-theme';
    const THEMES = ['auto', 'light', 'dark'];
    const systemDark = matchMedia('(prefers-color-scheme: dark)');
    const themeButton = document.getElementById('theme');

    function loadThemeChoice() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        return THEMES.includes(saved) ? saved : 'auto';
      } catch { return 'auto'; }
    }

    let themeChoice = loadThemeChoice();

    function applyTheme() {
      const root = document.documentElement;
      if (themeChoice === 'auto') root.removeAttribute('data-theme');
      else root.dataset.theme = themeChoice;

      const dark = themeChoice === 'auto' ? systemDark.matches : themeChoice === 'dark';
      themeButton.textContent = themeChoice === 'auto' ? 'Auto' : themeChoice === 'dark' ? 'Dark' : 'Light';

      // Read after the attribute change so it is the colour now on screen.
      const color = getComputedStyle(root).getPropertyValue('--bg').trim();
      // Off Android this rejects with "unsupported"; nothing to do then.
      Scenic.setSystemBars(dark, color).catch(() => {});
    }

    themeButton.addEventListener('click', () => {
      themeChoice = THEMES[(THEMES.indexOf(themeChoice) + 1) % THEMES.length];
      try { localStorage.setItem(THEME_KEY, themeChoice); } catch {}
      applyTheme();
    });
    // Android flipped between light and dark while the app was open.
    systemDark.addEventListener('change', applyTheme);
    applyTheme();

    // Errors from Rust arrive as { kind, message }.
    // kind: invalidImage | invalidArgument | tooLarge | io | network | android | unsupported | internal
    function errorText(err) {
      return typeof err === 'string' ? err : err?.message ?? String(err);
    }

    // ---------------------------------------------------------------
    // Placeholder UI. Replace with your own gallery.
    // ---------------------------------------------------------------
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const buttons = document.querySelectorAll('button[data-action]');

    // A generated sample so the buttons work before you hook up real images.
    function makeSample() {
      const c = document.createElement('canvas');
      c.width = 1080; c.height = 2340;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, c.width, c.height);
      const hue = Math.floor(Math.random() * 360);
      grad.addColorStop(0, `hsl(${hue} 60% 55%)`);
      grad.addColorStop(1, `hsl(${(hue + 120) % 360} 55% 20%)`);
      g.fillStyle = grad;
      g.fillRect(0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.92);
    }

    let current = makeSample();
    preview.style.backgroundImage = `url("${current}")`;

    function setStatus(text, isError = false) {
      status.textContent = text;
      status.classList.toggle('error', isError);
    }

    async function run(action) {
      buttons.forEach(b => (b.disabled = true));
      setStatus('Working…');
      try {
        if (action === 'download') {
          const r = await Scenic.downloadWallpaper(current);
          setStatus(`Saved ${r.fileName} to ${r.relativePath}`);
        } else {
          const r = await Scenic.setWallpaper(current, action);
          setStatus(`Wallpaper set (${r.target})`);
        }
      } catch (err) {
        setStatus(errorText(err), true);
      } finally {
        buttons.forEach(b => (b.disabled = false));
      }
    }

    buttons.forEach(b => b.addEventListener('click', () => run(b.dataset.action)));
    preview.addEventListener('click', () => {
      current = makeSample();
      preview.style.backgroundImage = `url("${current}")`;
    });
  </script>
</body>
</html>
