<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Scenic</title>

    <link rel="stylesheet" type="text/css" href="styles/fontasm.min.css">
    <link rel="stylesheet" type="text/css" href="styles/fontface.min.css">
    <link rel="stylesheet" type="text/css" href="styles/main.min.css">
    <!-- <link rel="stylesheet" type="text/css" href="styles/main.css"> -->
    <style rel="stylesheet" id="nightCSS"></style>
    <style rel="stylesheet" id="dayCSS"></style>

    <script type="text/javascript" src="scripts/head.min.js"></script>
    <script type="text/javascript" src="scripts/theme.min.js"></script>

    <script type="text/javascript" src="lib/gsap.min.js"></script>
    <script type="text/javascript" src="lib/Flip.min.js"></script>
    <script type="text/javascript" src="lib/MorphSVGPlugin.min.js"></script>
</head>
<body>
    <div id="container">
        <content data-type="notification">
            <div data-time=""></div>
        </content>
        <content data-type="wall-preview">
            <div id="imgsrc" data-type="wall-preview-image" class="sk">
                <span style="--_src: url('https://placehold.co/400x400/EEE/181818?text=Wallpaper+Preview')"></span>
            </div>

            <div data-type="wall-information">
                <div data-type="wall-author-image" class="sk">
                    <span style="--_src: url('https://placehold.co/100x100/EEE/181818?text=Author')"></span>
                </div>
                <div data-type="wall-heading">
                    <div data-type="wall-name">Holy Cow</div>
                    <div data-type="wall-author-name">Kxnt</div>
                </div>
                <div data-type="wall-ai-generated">
                    <icon data-icon="ai"></icon>
                </div>
                <div data-type="wall-customize">
                    <icon data-icon="customize"></icon>
                </div>
                <div data-type="wall-favorite">
                    <icon class="heart-stroked" data-icon="heart-stroked"></icon>
                    <icon class="heart-filled" data-icon="heart-filled"></icon>
                </div>
            </div>

            <div data-type="wall-set-save">
                <div data-type="wall-save" onclick="downloadWallpaper(imgToBase64(document.querySelector('#imgsrc')), 'sample.png')">
                    <icon data-icon="download"></icon>
                    <span>Save</span>
                </div>
                <div data-type="wall-set" onclick="setWallpaper(imgToBase64(document.querySelector('#imgsrc')), 'both')">
                    <icon data-icon="image"></icon>
                    <span>Set</span>
                </div>
            </div>
            
            <div data-type="wall-description">
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nam pharetra, arcu sed porta accumsan, ipsum leo finibus urna, interdum accumsan odio ipsum nec tortor.</p>
            </div>

            <div data-type="wall-technical">
                <div data-type="wall-format">
                    <icon data-icon="format"></icon>
                    <span>PNG</span>
                </div>
                <div data-type="wall-resolution">
                    <icon data-icon="resolution"></icon>
                    <span data-type="wall-width">1080</span>
                    <span data-type="wall-height">1920</span>
                </div>
                <div data-type="wall-package">
                    <icon data-icon="category"></icon>
                    <span>Scenic</span>
                </div>
                <div data-type="wall-size">
                    <icon data-icon="filesize"></icon>
                    <span>2.64 MB</span>
                </div>
            </div>
        </content>
        <content data-type="wall-gallery">

        </content>
    </div>
    <script type="text/javascript" src="scripts/body.min.js"></script>
</body>
</html>
