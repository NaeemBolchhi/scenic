[package]
name = "scenic"
version = "0.1.0"
description = "Scenic wallpaper app"
edition = "2021"
publish = false

[lib]
# The _lib suffix avoids a name clash with the binary on Windows,
# and the Android build loads this library by name.
name = "scenic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-scenic = { path = "../tauri-plugin-scenic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
